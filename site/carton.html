.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px 90px;}
.plate{position:relative;width:min(690px,100%);background:var(--beige-warm);text-align:center;

.names .amp{display:block;font-size:.6em;margin:-.06em 0;color:var(--gold);}
hr.rule-gold{width:120px;margin:24px auto;}
.date{font-size:1.22rem;letter-spacing:.06em;color:var(--ink);margin:.1rem 0;}
.place{font-style:italic;color:var(--olive-2);margin:.15rem 0 0;font-size:1.02rem;}
.intro{max-width:40ch;margin:22px auto 0;color:var(--ink);}
.cta{display:inline-block;margin-top:28px;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--olive);text-decoration:none;border:1px solid var(--olive);padding:12px 26px;transition:background .3s ease,color .3s ease;}
.cta:hover{background:var(--olive);color:var(--beige);}
.chateau{color:var(--olive);opacity:.85;margin:34px auto 0;display:block;}
